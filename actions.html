<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heat — Aktions-Bridge</title>
  <style>
    /* Transparent: als OBS-Browser-Quelle unsichtbar (nur die Bridge-Logik läuft). */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      font: 600 12px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; color: #fff; }

    /* Kompakter Verbindungs-Indikator (nur mit ?status=1). */
    #status { position: fixed; left: 10px; bottom: 10px; display: none;
      align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px;
      background: rgba(0, 0, 0, 0.55); pointer-events: none; }
    body.show-status #status { display: flex; }
    .ind { display: inline-flex; align-items: center; color: #9aa3b2; }
    .ind svg { width: 17px; height: 17px; display: block; }

    /* Ausführliches Panel (Zonen + Trigger-Log) nur in der Config-Vorschau (?dryrun=1). */
    #detail { position: fixed; left: 10px; top: 10px; right: 10px; display: none;
      flex-direction: column; gap: 8px; color: #e7eaf0; font-weight: 400; }
    body.show-detail #detail { display: flex; }
    #zones { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge { padding: 4px 9px; border-radius: 6px; background: rgba(31, 35, 44, 0.92); }
    .zone { color: #9aa3b2; } .skip { color: #ff7a6a; } .warn { color: #ffb070; }
    #log { background: rgba(24, 27, 34, 0.92); border-radius: 8px; padding: 8px;
      max-height: 55vh; overflow: auto; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <!-- Verbindungs-Indikator: Icon-Farbe = Status (grün/orange/rot/blau). title = Volltext. -->
  <div id="status">
    <span class="ind" id="indHeat" title="Heat">
      <!-- Cursor/Klick -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.5 18 2.3-7.2L20 11.5z"/></svg>
    </span>
    <span class="ind" id="indSb" title="Streamer.Bot">
      <!-- Bot -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
    </span>
  </div>

  <div id="detail">
    <div id="zones"></div>
    <div id="log"></div>
  </div>

  <script src="js/heat-zones.js"></script>
  <script src="js/heat-core.js"></script>
  <script src="js/heat-actions.js"></script>
  <script>
    const el = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // Sichtbarkeit aus URL: Indikator nur mit status=1, Detail-Panel nur im dry-run.
    const params = new URLSearchParams(location.search);
    if (params.get('status') === '1') document.body.classList.add('show-status');
    if (params.get('dryrun') === '1') document.body.classList.add('show-detail');

    // Statusfarbe nach Schlüsselwörtern in der Statusmeldung.
    function colorFor(s) {
      if (/bereit|verbunden/i.test(s)) return '#4ade80';     // grün — verbunden/bereit
      if (/fehlgeschlagen|error/i.test(s)) return '#f87171'; // rot — Fehler/Auth
      if (/getrennt|reconnect|…/i.test(s)) return '#fbbf24'; // orange — getrennt/verbindet
      if (/sim|dry/i.test(s)) return '#60a5fa';              // blau — Sim/Test
      return '#9aa3b2';                                       // grau — unbekannt
    }

    function line(html) {
      const d = document.createElement('div');
      d.innerHTML = html;
      el('log').prepend(d);
    }

    window.HeatPanel = {
      heat: (m) => { const e = el('indHeat'); e.style.color = colorFor(m); e.title = 'Heat: ' + m; },
      sb: (s) => { const e = el('indSb'); e.style.color = colorFor(s); e.title = 'Streamer.Bot: ' + s; },
      log: (m) => line('<span class="warn">' + esc(m) + '</span>'),
      zones: (zones, actions) => {
        el('zones').innerHTML = zones.map((z, i) => {
          const a = actions[i];
          return a && a.action
            ? '<span class="badge zone">Zone ' + (i + 1) + ' → "' + esc(a.action) + '" (enter ' + esc(a.enter) + ')</span>'
            : '<span class="badge skip">Zone ' + (i + 1) + ' → keine Action (skip)</span>';
        }).join(' ');
      },
      fire: (n, action, count, dry) => line('<b>Zone ' + esc(n) + '</b> → "' + esc(action) + '" · ' + esc(count) + ' Klicks' + (dry ? ' <span class="zone">(dry-run, nicht gesendet)</span>' : '')),
    };

    HeatActions.init();
  </script>
</body>
</html>
