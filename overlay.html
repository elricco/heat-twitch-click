<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heat Cluster Overlay</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    #overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #status {
      position: fixed; left: 10px; bottom: 10px;
      font: 600 12px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
      color: #fff; background: rgba(0, 0, 0, 0.45);
      padding: 4px 9px; border-radius: 6px;
      display: none; pointer-events: none;
    }
    body.show-status #status { display: block; }
  </style>
</head>
<body>
  <canvas id="overlay"></canvas>
  <div id="status">…</div>
  <script src="js/heat-zones.js"></script>
  <script src="js/heat-core.js"></script>
  <script src="js/heat-overlay.js"></script>
  <script>HeatOverlay.init();</script>
</body>
</html>
